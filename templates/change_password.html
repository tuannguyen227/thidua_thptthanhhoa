<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu - Quản lý Thi đua</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { width: 260px; height: 100vh; position: fixed; top: 0; left: 0; background-color: #004080; color: white; padding-top: 20px; z-index: 1000; overflow-y: auto;}
        .sidebar h4 { font-size: 18px; font-weight: bold; text-align: center; padding-bottom: 15px; border-bottom: 1px solid #0054a6; }
        .sidebar .nav-link { color: #cce6ff; font-weight: 600; padding: 12px 20px; font-size: 14px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: #002244; color: white; border-left: 4px solid #4da6ff; }
        
        .main-content { margin-left: 260px; padding: 35px; }
        .card { border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    {% include 'sidebar.html' %}

    <div class="main-content">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-danger shadow-sm" style="border-top: 4px solid #dc3545 !important;">
                    <div class="card-header bg-white pt-4 pb-3 border-0 text-center">
                        <h4 class="fw-bold text-danger m-0"><i class="fa-solid fa-key me-2"></i> ĐỔI MẬT KHẨU TRỰC TUYẾN</h4>
                        <p class="text-muted small mt-1">Cập nhật mật khẩu bảo mật cho tài khoản của bạn</p>
                    </div>
                    <div class="card-body p-4">
                        {% with messages = get_flashed_messages(with_categories=true) %}
                          {% if messages %}
                            {% for category, message in messages %}
                              <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show shadow-sm">
                                {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                              </div>
                            {% endfor %}
                          {% endif %}
                        {% endwith %}

                        <form method="POST" action="/change-password">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary">Tên đăng nhập xác thực:</label>
                                <input type="text" class="form-control fw-bold text-primary shadow-sm" name="login_id" value="{{ default_username }}" required placeholder="VD: admin">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary">Mật khẩu mới:</label>
                                <input type="password" class="form-control shadow-sm" name="new_password" required placeholder="Tối thiểu 3 ký tự...">
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold text-secondary">Xác nhận mật khẩu mới:</label>
                                <input type="password" class="form-control shadow-sm" name="confirm_password" required placeholder="Nhập lại mật khẩu mới...">
                            </div>
                            <div class="d-flex gap-2">
                                <a href="/dashboard" class="btn btn-secondary w-50 fw-bold py-2"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại</a>
                                <button type="submit" class="btn btn-danger w-50 fw-bold py-2 shadow-sm"><i class="fa-solid fa-floppy-disk me-1"></i> Đổi mật khẩu</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
